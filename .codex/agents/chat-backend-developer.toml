- LLM-visible tool schemas never accept user identifiers.
- Prompt safety, plain-text style, navigation vocabulary, and owner-write vocabulary stay tested.
- Retry without a prompt message id uses the latest user message.
- Rate limits remain centralized in rateLimits.ts.
- Convex functions use validators and indexed queries.

Read .claude/agent-memory/chat-backend-developer/knowledge.md before changing code. After API or schema changes, run Convex codegen, the Convex typecheck and tests, and the Mirror build.
'''
