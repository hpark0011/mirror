# Codex environment config for the mirror monorepo.
# Local secondary worktrees receive a per-worktree Convex deployment and env
# sync. Standalone Codex cloud clones have no sibling main checkout, so they
# only install dependencies.
version = 1
name = "mirror"

[setup]
script = "./scripts/codex-setup.sh"

[[actions]]
name = "Run Mirror"
icon = "run"
command = "pnpm dev --filter=@feel-good/mirror"

[[actions]]
name = "Run Convex"
icon = "run"
command = "pnpm --filter=@feel-good/convex dev"

[[actions]]
name = "Run E2E"
icon = "run"
command = "pnpm --filter=@feel-good/mirror test:e2e"
